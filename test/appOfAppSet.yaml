apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appofappset
  namespace: openshift-gitops
spec:
  destination:
    name: ''
    namespace: openshift-gitops
    server: 'https://kubernetes.default.svc'
  source:
    path: test/applicationSet
    repoURL: 'https://github.com/davidseve/argocd-environments-promotion.git'
    targetRevision: test
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true